<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Roadmap</title>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<h1>Session Roadmap
  <span class="view-toggle">
    <button class="view-btn active" id="btn-project" onclick="setView('project')">Project</button>
    <button class="view-btn" id="btn-flat" onclick="setView('flat')">Flat</button>
    <button class="view-btn" id="btn-graph" onclick="setView('graph')">Mind Map</button>
  </span>
</h1>
<div class="meta" id="meta">Loading...</div>
<div id="content"></div>
<div id="graph-container">
  <div id="graph-toolbar">
    <select id="project-select" onchange="onProjectChange()" style="padding:4px 8px;background:#161b22;border:1px solid #30363d;border-radius:4px;color:#c9d1d9;font-size:0.82rem;"></select>
    <select id="period-filter" onchange="onFilterChange()" style="padding:4px 8px;background:#161b22;border:1px solid #30363d;border-radius:4px;color:#c9d1d9;font-size:0.82rem;">
      <option value="1">1 day</option>
      <option value="3" selected>3 days</option>
      <option value="7">7 days</option>
      <option value="30">30 days</option>
      <option value="0">All</option>
    </select>
    <label style="display:flex;align-items:center;gap:4px;color:#8b949e;font-size:0.78rem;cursor:pointer;">
      <input type="checkbox" id="hide-done" onchange="onFilterChange()" style="accent-color:#58a6ff;cursor:pointer;">
      Hide done
    </label>
    <button onclick="graphFit()">Fit</button>
    <button onclick="graphReset()">Reset</button>
  </div>
  <div id="graph-canvas"></div>
  <div id="graph-inspector">
    <div class="inspector-header">
      <span class="inspector-name" id="inspector-name"></span>
      <button class="inspector-close" onclick="closeInspector()">&times;</button>
    </div>
    <div id="inspector-body"></div>
  </div>
</div>

<script src="/static/theme.js"></script>
<script src="/static/layout.js"></script>
<script src="/static/tree.js"></script>
<script src="/static/graphdata.js"></script>
<script src="/static/edit.js"></script>
<script src="/static/drag.js"></script>
<script src="/static/app.js"></script>
</body>
</html>

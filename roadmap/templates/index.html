function formatDateTime(s) {
  if (!s) return '';
  var d = new Date(s);
  if (isNaN(d.getTime())) return s;
  var pad = function(n) { return n < 10 ? '0' + n : '' + n; };
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function summarizeGroup(group) {
  // Summarize by attention state (semantic) rather than status (mechanical)
  var counts = {};
  group.sessions.forEach(function(s) {
    var attn = s.attention_state || s.status || 'unknown';
    counts[attn] = (counts[attn] || 0) + 1;
  });
  var parts = [];
  if (counts['blocked']) parts.push('\u25CF ' + counts['blocked'] + ' blocked');
  if (counts['active'] || counts['in-progress']) {
    var n = (counts['active'] || 0) + (counts['in-progress'] || 0);
    parts.push('\u25CF ' + n + ' active');
  }
  if (counts['waiting'] || counts['review']) {
    var n = (counts['waiting'] || 0) + (counts['review'] || 0);
    parts.push('\u25CF ' + n + ' waiting');
  }
  if (parts.length === 0) parts.push(group.sessions.length + ' sessions');
  return parts.join('  ');
}

// ── 左右バランス配置（All Projects） ──
// root の子の部分木を左右に振り分け、左は root の x で鏡写しにし、各側で縦に詰め直す。
// 入力は vis の初期（hierarchical LR）配置後の座標つきノード {id, label, x, y, h} と辺。DOM / vis に依存しない純関数。
// Why not vis の hierarchical だけで左右に割る: LR は全ノードを root の右に並べるので、後処理で座標を作り直す。
// 戻り値の positions は部分木に属する全ノードの新しい座標、side は各ノードの 'left' / 'right'。
var LAYOUT_GAP = 24;
// root の子ごとの左右（直前の描画）。再描画をまたいで部分木の側を保つ。プロジェクト切り替えで捨てる
var islandSides = {};

function balancedLayout(nodes, edges, rootId, prevSides) {
  prevSides = prevSides || {};
  var byId = {};
  nodes.forEach(function(n) { byId[n.id] = n; });
  var rootNode = byId[rootId];
  if (!rootNode) return null;

  var kids = {};
  edges.forEach(function(e) { (kids[e.from] = kids[e.from] || []).push(e.to); });
  function byLabel(a, b) {
    var la = String(byId[a].label), lb = String(byId[b].label);
    return la < lb ? -1 : la > lb ? 1 : (a < b ? -1 : a > b ? 1 : 0);
  }

  // 部分木。複数の子から届くノードは先に辿った方に属させる（ツリー辺のみなので通常は起きない）
  var owner = {};
  owner[rootId] = rootId;
  var seen = {};
  var heads = (kids[rootId] || []).filter(function(id) {
    if (!byId[id] || seen[id]) return false;
    seen[id] = true;
    return true;
  }).sort(byLabel);
  var subtrees = heads.map(function(head) {
    var members = [];
    var stack = [head];
    owner[head] = head;
    while (stack.length) {
      var id = stack.pop();
      members.push(id);
      (kids[id] || []).forEach(function(c) {
        if (byId[c] && !owner[c]) { owner[c] = head; stack.push(c); }
      });
    }
    return { head: head, members: members };
  });

  // 既存の部分木は前回の側に留め、新しい部分木だけを軽い側へ（同数なら右）割り振る。
  // Why: 島を 1 つ足すたびに全体を貪欲法で振り直すと、無関係な部分木が左右を行き来して位置を見失う。
  // 新規の振り分けは大きい順・ラベル順で決め、再描画で並びが揺れないようにする。各側の積み順もラベル順。
  var left = [], right = [], leftCount = 0, rightCount = 0;
  var headSides = {};
  function assign(st, sideName) {
    headSides[st.head] = sideName;
    if (sideName === 'left') { left.push(st); leftCount += st.members.length; }
    else { right.push(st); rightCount += st.members.length; }
  }
  var fresh = [];
  subtrees.forEach(function(st) {
    if (prevSides[st.head] === 'left' || prevSides[st.head] === 'right') assign(st, prevSides[st.head]);
    else fresh.push(st);
  });
  fresh.sort(function(a, b) {
    return b.members.length - a.members.length || byLabel(a.head, b.head);
  }).forEach(function(st) {
    assign(st, leftCount < rightCount ? 'left' : 'right');
  });

  var positions = {};
  var side = {};
  positions[rootId] = { x: rootNode.x, y: rootNode.y };
  function place(list, mirror) {
    list.sort(function(a, b) { return byLabel(a.head, b.head); });
    var extents = list.map(function(st) {
      var top = Infinity, bottom = -Infinity;
      st.members.forEach(function(id) {
        var n = byId[id], h = n.h || 30;
        top = Math.min(top, n.y - h / 2);
        bottom = Math.max(bottom, n.y + h / 2);
      });
      return { top: top, height: bottom - top };
    });
    var total = extents.reduce(function(sum, e) { return sum + e.height; }, 0) + LAYOUT_GAP * Math.max(0, list.length - 1);
    var cursor = rootNode.y - total / 2;
    list.forEach(function(st, i) {
      var dy = cursor - extents[i].top;
      st.members.forEach(function(id) {
        var n = byId[id];
        positions[id] = { x: mirror ? 2 * rootNode.x - n.x : n.x, y: n.y + dy };
        side[id] = mirror ? 'left' : 'right';
      });
      cursor += extents[i].height + LAYOUT_GAP;
    });
  }
  place(right, false);
  place(left, true);
  return { positions: positions, side: side, headSides: headSides };
}

// ── Islands ──
// Why: island はユーザーが手で作るテーマノードで、repo と 1 本の木になる（親は island / repo のどちらでもよい）。
// 2 つの builder（tree / semantic DAG）が同じ描画を共有するよう、構築後に 1 か所で重ねる。
var cachedIslands = { islands: [], repos: [] };

var ROOT_ID = 'root';

function normalizeIslands(d) {
  return { islands: (d && d.islands) || [], repos: (d && d.repos) || [] };
}

// ノード ID は /api/islands の親 ref（island:<id> / repo:<path>）と同じ形にしてある。親をそのままノード ID として辿れる
var REPO_PREFIX = 'repo:';
var ISLAND_PREFIX = 'island:';

function repoNodeId(repoRoot) {
  return REPO_PREFIX + (repoRoot || '__ungrouped__');
}

function islandNodeId(id) {
  return ISLAND_PREFIX + id;
}

function repoBaseName(root) {
  var parts = String(root).split('/').filter(function(p) { return p; });
  return parts.length ? parts[parts.length - 1] : String(root);
}

// ── Mind Map theme ──
// 見た目の数値・色はここに集約する。値は MindMup（mapjs）の既定テーマの数値・配色を参考にしたもので、コードは写していない。
// Why not 自前の vis 描画をやめて mapjs を使う: セッション状態の色・DAG・live 更新など既存の描画資産を vis-network 上に残すため。
// 背景は全て不透明（半透明だとエッジが透ける）。dim も透明度ではなく不透明の暗い色で表す。
// vis-network の fit() は既定で拡大率を 1 で頭打ちにするため、ノードの少ない Map が大きな画面の中央に小さく残る。
// 上限を上げても、ノードの多い Map は縮小側に fit するので影響しない
var FIT_MAX_ZOOM = 1.8;

var MINDMAP_THEME = {
  fontFace: 'NotoSans, "Helvetica Neue", Roboto, Helvetica, Arial, sans-serif',
  fontSize: 12,
  radius: 10,
  margin: { top: 5, right: 8, bottom: 5, left: 8 },
  borderWidth: 1,
  borderWidthSelected: 3,
  shadow: { enabled: true, color: 'rgba(7,7,7,0.4)', size: 2, x: 2, y: 2 },
  maxWidth: 146,
  edge: '#707070',
  root:    { bg: '#22AAE0', border: '#707070', font: '#EEEEEE' },
  island:  { bg: '#E0E0E0', border: '#707070', font: '#4F4F4F' },
  repo:    { bg: '#C9D3DC', border: '#707070', font: '#2F2F2F' },
  // アクティブな context が無い repo。暗い背景のページに溶けない程度に落とした色
  repoDim: { bg: '#4A525B', border: '#5A626B', font: '#B6BEC6' }
};

// ツリー辺（root / island / repo / session を繋ぐ辺）。DAG の意味付きの辺には使わない
function treeEdge(from, to) {
  return {
    from: from, to: to,
    color: { color: MINDMAP_THEME.edge, inherit: false },
    width: 1,
    arrows: { to: { enabled: false } }
  };
}

// _type から色の種別を決める。session / タスク等は null で、builder が与えた意味色をそのまま使う。
// アクティブな session が無い repo は dim。
function themeKindOf(n) {
  if (n._type === 'root' || n._type === 'island') return n._type;
  if (n._type === 'project') return n._data && n._data.sessions && n._data.sessions.length === 0 ? 'repoDim' : 'repo';
  return null;
}

// 見た目を決める唯一の場所。全ノードに共通の形（角丸・余白・影・折り返し幅）と、構造ノードの色を与える。
// 構造ノード（root / island / repo / session）だけ文字サイズも揃え、DAG のタスクノードは自前のサイズと色を保つ。
// Why: builder / overlay には構造（id・label・level・_type・_data）だけを持たせ、色を散らさない。
function applyMindmapTheme(nodes) {
  var T = MINDMAP_THEME;
  var uniform = { root: 1, island: 1, project: 1, session: 1 };
  nodes.forEach(function(n) {
    n.shape = 'box';
    n.shapeProperties = Object.assign({}, n.shapeProperties, { borderRadius: T.radius });
    n.margin = Object.assign({}, T.margin);
    // builder が与えた太さは残す（session の待ち = 3 / attention = 2 の強調を潰さない）。未指定のノードだけ既定にする
    if (n.borderWidth === undefined) n.borderWidth = T.borderWidth;
    n.borderWidthSelected = T.borderWidthSelected;
    if (!n.shadow) n.shadow = Object.assign({}, T.shadow); // フォーカス中ノードの青いグローは残す
    n.widthConstraint = { maximum: T.maxWidth };
    var f = Object.assign({}, n.font, { face: T.fontFace });
    if (uniform[n._type]) f.size = T.fontSize;
    var kind = themeKindOf(n);
    if (kind) {
      var c = T[kind];
      n.color = { background: c.bg, border: c.border };
      f.color = c.font;
      f.bold = true;
      f.multi = true;
    }
    n.font = f;
  });
}

// builder 共通の後処理。All Projects は island / root を重ね、全モードにテーマを当てる。
// rootId は中央 root があるときだけ入る（左右バランス配置の起点。単一プロジェクト表示では null）。
function postProcess(nodes, edges, isAllProjects) {
  var rootId = isAllProjects ? islandOverlay(nodes, edges, cachedIslands) : null;
  applyMindmapTheme(nodes);
  return { nodes: nodes, edges: edges, rootId: rootId };
}

// ── Islands overlay ──
// nodes / edges を破壊的に更新する。All Projects 専用。戻り値は root の ID（ノードが無ければ null）。
// repo ノードは builder が置いたものを nodes から拾う。親は /api/islands が dangling を "" に解決済み（ここでは再検証しない）。
function islandOverlay(nodes, edges, islandsData) {
  var nodeIds = {};
  nodes.forEach(function(n) { nodeIds[n.id] = true; });

  var parentOf = {};
  islandsData.islands.forEach(function(is) { if (is.parent) parentOf[islandNodeId(is.id)] = is.parent; });
  islandsData.repos.forEach(function(r) { if (r.parent) parentOf[repoNodeId(r.root)] = r.parent; });

  // セッションが無い（またはフィルタで消えた）repo も、island 構造に関わるなら薄いノードで出す。
  // Why: 手で組んだ構造が「アクティブな context がある repo だけ」に依存して消えるのを避ける
  function ensureRepoNode(id, root) {
    if (nodeIds[id]) return;
    nodeIds[id] = true;
    nodes.push({
      id: id,
      label: repoBaseName(root) + '\n(no active sessions)',
      level: 0,
      _type: 'project',
      _data: { name: repoBaseName(root), repo_root: root, sessions: [] }
    });
  }
  function ensureParentRepo(parentRef) {
    if (parentRef.indexOf(REPO_PREFIX) === 0) ensureRepoNode(parentRef, parentRef.slice(REPO_PREFIX.length));
  }
  islandsData.repos.forEach(function(r) {
    if (!r.parent) return;
    ensureRepoNode(repoNodeId(r.root), r.root);
    ensureParentRepo(r.parent);
  });
  islandsData.islands.forEach(function(is) { if (is.parent) ensureParentRepo(is.parent); });

  islandsData.islands.forEach(function(is) {
    nodeIds[islandNodeId(is.id)] = true;
    nodes.push({ id: islandNodeId(is.id), label: is.name, level: 0, _type: 'island', _data: is });
  });

  // island / repo の木の辺と、根からの深さ。island→repo→island→repo の鎖でも LR に並ぶ。
  // 深さは DAG と同じ computeNodeDepth（根 = 1、循環は打ち切り）。root を level 0 に置くので、そのまま level になる
  var treeEdges = Object.keys(parentOf).map(function(child) { return { from: parentOf[child], to: child }; });
  var memo = {};
  var treeNodes = nodes.filter(function(n) { return n._type === 'island' || n._type === 'project'; });

  // repo 配下（session / more / DAG）は、repo の level 分だけまとめてずらす。builder は repo = 0 起点で level を振っている。
  // 辺を下向きに辿るので、辺で繋がらない DAG ノードは builder が不可視の辺で繋いである（buildSemanticGraph）。
  // 木の辺を足す前の builder の辺だけを辿る（repo→island の辺を辿ると island を二重にずらす）
  var kids = {};
  edges.forEach(function(e) { (kids[e.from] = kids[e.from] || []).push(e.to); });
  var nodeById = {};
  nodes.forEach(function(n) { nodeById[n.id] = n; });
  treeNodes.forEach(function(n) {
    n.level = computeNodeDepth(n.id, treeEdges, nodes, memo);
    if (n._type !== 'project') return;
    var seen = {};
    var stack = (kids[n.id] || []).slice();
    while (stack.length) {
      var id = stack.pop();
      if (seen[id]) continue;
      seen[id] = true;
      nodeById[id].level += n.level;
      (kids[id] || []).forEach(function(c) { stack.push(c); });
    }
  });
  treeEdges.forEach(function(e) { edges.push(treeEdge(e.from, e.to)); });

  // 親の無い island / repo（未登録 repo や Other を含む）を全て root にぶら下げる。
  // Why: 左右バランス配置が root 起点の部分木分割で成り立つため、孤立したトップレベルを作らない
  if (nodes.length === 0) return null;
  nodes.push({ id: ROOT_ID, label: 'devctx', level: 0, _type: 'root' });
  treeNodes.forEach(function(n) {
    if (!parentOf[n.id]) edges.push(treeEdge(ROOT_ID, n.id));
  });
  return ROOT_ID;
}

function buildMindMapData(groups) {
  var nodes = [];
  var edges = [];

  var filteredGroups = groups;
  selectedProject = document.getElementById('project-select').value;
  if (selectedProject) {
    filteredGroups = groups.filter(function(g) { return g.repo_root === selectedProject; });
  }

  // Apply period and done filters
  filteredGroups = filteredGroups.map(function(g) {
    return Object.assign({}, g, { sessions: filterSessions(g.sessions) });
  }).filter(function(g) { return g.sessions.length > 0; });

  var isAllProjects = !selectedProject;
  var isSingleProject = filteredGroups.length === 1;
  // 単一セッションで project ノードを省くのは単一プロジェクト表示だけ。All Projects では island の親子が繋がらなくなる
  var isSingleSession = !isAllProjects && isSingleProject && filteredGroups[0] && filteredGroups[0].sessions.length === 1;

  // Sort groups by priority (most urgent first) in All Projects view
  if (isAllProjects) {
    filteredGroups = filteredGroups.slice().sort(function(a, b) {
      return groupPriority(b) - groupPriority(a);
    });
  }

  // Determine level offsets — root node removed, projects are top-level
  var projectLevel = 0;
  var sessionLevel = 1;
  var detailLevel = 2;
  var showProject = !isSingleSession;

  if (isSingleSession) {
    sessionLevel = 0;
    detailLevel = 1;
  }

  filteredGroups.forEach(function(group) {
    var projectId = repoNodeId(group.repo_root);

    // Project node (skip when single session)
    if (showProject) {
      var projLabel = group.name;
      if (isAllProjects) {
        projLabel += '\n' + summarizeGroup(group);
      } else {
        projLabel += ' (' + group.sessions.length + ')';
      }

      // Project nodes are always neutral — attention shown via badges in label
      nodes.push({ id: projectId, label: projLabel, level: projectLevel, _type: 'project', _data: group });
    }

    var sessionParent = showProject ? projectId : null;

    // In All Projects, limit sessions per project to keep the graph readable
    var maxSessions = isAllProjects ? 5 : Infinity;
    var visibleSessions = group.sessions.slice(0, maxSessions);
    var truncated = group.sessions.length > maxSessions;

    visibleSessions.forEach(function(session) {
      var sessionId = 'session:' + session.name;
      var label = session.name + '\n' + agentLine(session);
      if (session.current_focus) {
        var f = session.current_focus;
        if (f.length > 30) f = f.substring(0, 28) + '..';
        label += '\n' + f;
      }

      nodes.push({
        id: sessionId, label: label, shape: 'box',
        color: sessionNodeStyle(session).color,
        font: { color: '#f0f6fc', size: 13, face: '-apple-system, sans-serif', bold: true, multi: true },
        margin: { top: 6, bottom: 6, left: 10, right: 10 },
        borderWidth: sessionNodeStyle(session).borderWidth, level: sessionLevel, _type: 'session', _data: session
      });
      if (sessionParent) {
        edges.push(treeEdge(sessionParent, sessionId));
      }

      // No roadmap warning (skip in All Projects to reduce noise)
      if (!isAllProjects && !session.goal && (!session.tasks || session.tasks.length === 0)) {
        var warnId = 'warn:' + session.name;
        nodes.push({
          id: warnId, label: '\u26A0 No roadmap', shape: 'box',
          color: { background: '#2a1215', border: '#f85149' },
          font: { color: '#f85149', size: 10 },
          margin: { top: 3, bottom: 3, left: 8, right: 8 },
          borderWidth: 1, borderDashes: [4, 4], level: detailLevel, _type: 'warning'
        });
        edges.push({ from: sessionId, to: warnId, color: { color: '#f8514944' }, width: 1, dashes: true });
      }
    });

    if (truncated && sessionParent) {
      var moreId = 'more:' + projectId;
      var remaining = group.sessions.length - maxSessions;
      nodes.push({
        id: moreId,
        label: '+' + remaining + ' more...',
        shape: 'box',
        color: { background: '#161b22', border: '#30363d' },
        font: { color: '#8b949e', size: 11, face: '-apple-system, sans-serif' },
        margin: { top: 3, bottom: 3, left: 6, right: 6 },
        borderWidth: 1,
        borderDashes: [4, 4],
        level: sessionLevel,
        _type: 'more',
        _data: group
      });
      edges.push({ from: sessionParent, to: moreId, color: { color: '#30363d44' }, width: 1, dashes: true });
    }
  });

  return postProcess(nodes, edges, isAllProjects);
}

// Compute topological depth of a node in the DAG (longest path from root)
function computeNodeDepth(nodeId, edges, nodes, memo, visiting) {
  if (!memo) memo = {};
  if (!visiting) visiting = {};
  if (memo[nodeId] !== undefined) return memo[nodeId];
  if (visiting[nodeId]) return 1; // cycle guard
  visiting[nodeId] = true;
  var incomingEdges = edges.filter(function(e) { return e.to === nodeId; });
  if (incomingEdges.length === 0) {
    memo[nodeId] = 1;
    delete visiting[nodeId];
    return 1;
  }
  var maxDepth = 0;
  incomingEdges.forEach(function(e) {
    var d = computeNodeDepth(e.from, edges, nodes, memo, visiting);
    if (d > maxDepth) maxDepth = d;
  });
  memo[nodeId] = maxDepth + 1;
  delete visiting[nodeId];
  return memo[nodeId];
}

// sessionId から辺（edges[fromIndex..]）で辿れないノードを、不可視の辺で sessionId に繋ぐ。
// Why: goal の無い session のタスクは goal→task の辺が無く、辺を辿る後処理（repo 配下の level ずらし・左右の振り分け）から漏れる。
// Why not 全ノードに所属タグを付ける: タグを builder が持つと overlay との結合が増えるので、辺という既存の構造だけで繋ぐ。
function connectOrphanNodes(edges, fromIndex, sessionId, nodeIds) {
  var kids = {};
  edges.slice(fromIndex).forEach(function(e) { (kids[e.from] = kids[e.from] || []).push(e.to); });
  var reached = {};
  function walk(id) {
    var stack = [id];
    while (stack.length) {
      var cur = stack.pop();
      if (reached[cur]) continue;
      reached[cur] = true;
      (kids[cur] || []).forEach(function(c) { stack.push(c); });
    }
  }
  walk(sessionId);
  nodeIds.forEach(function(id) {
    if (reached[id]) return;
    edges.push({ from: sessionId, to: id, hidden: true });
    walk(id);
  });
}

// Build DAG from /api/roadmap-graph data for Single Project view
function buildSemanticGraph(graphData) {
  var nodes = [];
  var edges = [];

  // Opaque backgrounds — edges are hidden behind nodes
  var NODE_STYLES = {
    goal:      { bg: '#1e1610', border: '#f0883e', fontColor: '#f0883e', icon: '\uD83C\uDFAF ', fontSize: 14, borderWidth: 2 },
    task:      { bg: '#161b22', border: '#484f58', fontColor: '#8b949e', icon: '\u25CB ', fontSize: 12, borderWidth: 1 },
    milestone: { bg: '#111d2e', border: '#79c0ff', fontColor: '#79c0ff', icon: '\u25C6 ', fontSize: 13, borderWidth: 2 },
    rejected:  { bg: '#131618', border: '#484f58', fontColor: '#484f58', icon: '\u2717 ', fontSize: 11, borderWidth: 1 }
  };
  var STATUS_STYLES = {
    in_progress: { bg: '#0f2744', border: '#58a6ff', fontColor: '#f0f6fc', icon: '\u25B6 ', fontSize: 13, borderWidth: 3 },
    done:        { bg: '#0f2018', border: '#3fb950', fontColor: '#3fb950', icon: '\u2713 ', fontSize: 12, borderWidth: 1 },
    blocked:     { bg: '#2a1215', border: '#f85149', fontColor: '#f85149', icon: '\u2716 ', fontSize: 12, borderWidth: 2 },
    planned:     { bg: '#161b22', border: '#484f58', fontColor: '#8b949e', icon: '\u25CB ', fontSize: 12, borderWidth: 1 },
    rejected:    { bg: '#131618', border: '#484f58', fontColor: '#484f58', icon: '\u2717 ', fontSize: 11, borderWidth: 1 }
  };

  var EDGE_STYLES = {
    fork:       { color: '#484f58', width: 1.5, dashes: false },
    flow:       { color: '#79c0ff', width: 2, dashes: false },
    dependency: { color: '#8b949e', width: 1, dashes: [5, 5] },
    rejected:   { color: '#484f5866', width: 1, dashes: [3, 3] }
  };

  var isAllProjects = !selectedProject;
  var maxSessions = isAllProjects ? 5 : Infinity;

  graphData.forEach(function(projectGroup) {
    // Apply period and done filters to graph sessions
    var filteredSessions = filterSessions(projectGroup.sessions);
    if (filteredSessions.length === 0) return;

    // "+N more" は表示切り詰めの前に、フィルタ後の件数で数える
    var filteredCount = filteredSessions.length;
    var truncated = filteredCount > maxSessions;
    filteredSessions = filteredSessions.slice(0, maxSessions);

    // All Projects では常に repo ノードを置く（island の親子が繋がるのは repo ノード経由）
    var showProjectNode = isAllProjects || graphData.length > 1 || filteredSessions.length > 1;
    var projectNodeId = null;

    if (showProjectNode) {
      projectNodeId = repoNodeId(projectGroup.repo_root);
      nodes.push({ id: projectNodeId, label: projectGroup.name, level: 0, _type: 'project', _data: projectGroup });
    }

    filteredSessions.forEach(function(session) {
      var baseLevel = showProjectNode ? 1 : 0;

      // Session header node — Goal is integrated as subtitle, not a separate node
      var sessionNodeId = 'session:' + session.name;
      var sessionLabel = session.name + '\n' + agentLine(session);
      if (session.goal) {
        var goalText = session.goal;
        if (goalText.length > 30) goalText = goalText.substring(0, 28) + '..';
        sessionLabel += '\n\uD83C\uDFAF ' + goalText;
      } else if (session.current_focus) {
        var cf = session.current_focus;
        if (cf.length > 30) cf = cf.substring(0, 28) + '..';
        sessionLabel += '\n' + cf;
      }
      nodes.push({
        id: sessionNodeId, label: sessionLabel, shape: 'box',
        color: sessionNodeStyle(session).color,
        font: { color: '#f0f6fc', size: 14, bold: true, multi: true },
        margin: { top: 8, bottom: 8, left: 12, right: 12 },
        borderWidth: sessionNodeStyle(session).borderWidth, level: baseLevel, _type: 'session', _data: session
      });
      if (projectNodeId) {
        edges.push(treeEdge(projectNodeId, sessionNodeId));
      }

      if (!session.nodes || session.nodes.length === 0) {
        // No DAG data — All Projects ではノイズになるので warning を出さずに打ち切る
        if (isAllProjects) return;
        var warnId = 'warn:' + session.name;
        nodes.push({
          id: warnId, label: '\u26A0 No roadmap', shape: 'box',
          color: { background: '#2a1215', border: '#f85149' },
          font: { color: '#f85149', size: 10 },
          margin: { top: 3, bottom: 3, left: 8, right: 8 },
          borderWidth: 1, borderDashes: [4, 4], level: baseLevel + 1, _type: 'warning'
        });
        edges.push({ from: sessionNodeId, to: warnId, color: { color: '#f8514944' }, width: 1, dashes: true });
        return;
      }

      // Map graph node IDs to vis-network IDs — skip Goal nodes (integrated into session)
      var idMap = {};
      // Filter out edges from/to goal for level computation
      var sessionEdges = session.edges || [];
      var nonGoalEdges = sessionEdges.filter(function(e) { return e.from !== 'goal' && e.to !== 'goal'; });

      session.nodes.forEach(function(gn) {
        if (gn.type === 'goal') return; // Goal is merged into session node

        // session 名で名前空間を切り、session 間で DAG ノード ID が衝突しないようにする
        var visId = 'dag:' + session.name + ':' + gn.id;
        idMap[gn.id] = visId;

        var style;
        if (gn.type === 'milestone') {
          style = NODE_STYLES.milestone;
        } else if (gn.type === 'rejected' || gn.status === 'rejected') {
          style = STATUS_STYLES.rejected;
        } else {
          style = STATUS_STYLES[gn.status] || NODE_STYLES.task;
        }

        // Current focus glow effect
        var isFocus = session.current_focus && gn.label &&
          gn.label.indexOf(session.current_focus) !== -1;
        var shadow = isFocus ? { enabled: true, color: '#58a6ff', size: 12, x: 0, y: 0 } : undefined;

        // Dynamic level based on topological depth (excluding goal edges)
        var level = baseLevel + computeNodeDepth(gn.id, nonGoalEdges, session.nodes);

        nodes.push({
          id: visId,
          label: style.icon + (gn.label.length > 20 ? gn.label.substring(0, 18) + '..' : gn.label),
          shape: 'box',
          color: { background: style.bg, border: style.border },
          font: { color: style.fontColor, size: style.fontSize, bold: gn.status === 'in_progress' },
          margin: { top: 5, bottom: 5, left: 10, right: 10 },
          borderWidth: style.borderWidth,
          borderDashes: (gn.type === 'rejected' || gn.status === 'rejected') ? [4, 4] : false,
          shadow: shadow,
          level: level,
          _type: gn.type,
          _data: gn
        });
      });

      var sessionEdgeStart = edges.length;
      // Connect fork/rejected edges from session node instead of goal node
      sessionEdges.forEach(function(ge) {
        if (ge.from === 'goal') {
          // Remap: goal → task becomes session → task
          var toVis = idMap[ge.to];
          if (!toVis) return;
          var toNode = session.nodes.find(function(n) { return n.id === ge.to; });
          var edgeColor = '#484f58';
          if (ge.type === 'rejected') edgeColor = '#484f5866';
          else if (toNode && toNode.status === 'in_progress') edgeColor = '#58a6ff';
          edges.push({
            from: sessionNodeId, to: toVis,
            color: { color: edgeColor },
            width: (toNode && toNode.status === 'in_progress') ? 2.5 : 1.5,
            dashes: ge.type === 'rejected' ? [3, 3] : false
          });
          return;
        }
        var fromVis = idMap[ge.from];
        var toVis = idMap[ge.to];
        if (!fromVis || !toVis) return;

        var es = EDGE_STYLES[ge.type] || EDGE_STYLES.fork;

        // Override edge color for active tasks
        var toNode = session.nodes.find(function(n) { return n.id === ge.to; });
        var edgeColor = es.color;
        if (toNode && toNode.status === 'in_progress' && ge.type !== 'rejected') {
          edgeColor = '#58a6ff';
        } else if (toNode && toNode.status === 'done' && ge.type === 'flow') {
          edgeColor = '#3fb95088';
        }

        edges.push({
          from: fromVis, to: toVis,
          color: { color: edgeColor },
          width: (toNode && toNode.status === 'in_progress') ? 3 : es.width,
          dashes: es.dashes,
          arrows: ge.type === 'dependency' ? { to: { enabled: true, scaleFactor: 0.5 } } : undefined
        });
      });
      // All Projects の level ずらしと左右の振り分けは辺を辿るので、辺で繋がらないタスクを不可視の辺で session に繋ぐ。
      // 単一プロジェクトの配置は変えない
      if (isAllProjects) connectOrphanNodes(edges, sessionEdgeStart, sessionNodeId, Object.keys(idMap).map(function(k) { return idMap[k]; }));
    });

    if (truncated && projectNodeId) {
      var moreId = 'more:' + projectNodeId;
      var remaining = filteredCount - maxSessions;
      nodes.push({
        id: moreId,
        label: '+' + remaining + ' more...',
        shape: 'box',
        color: { background: '#161b22', border: '#30363d' },
        font: { color: '#8b949e', size: 11, face: '-apple-system, sans-serif' },
        margin: { top: 3, bottom: 3, left: 6, right: 6 },
        borderWidth: 1, borderDashes: [4, 4], level: 1,
        _type: 'more', _data: projectGroup
      });
      edges.push({ from: projectNodeId, to: moreId, color: { color: '#30363d44' }, width: 1, dashes: true });
    }
  });

  return postProcess(nodes, edges, isAllProjects);
}

// ── Island editing ──
// 編集は All Projects の Mind Map だけ（island は All Projects にしか描かれない）。変更は POST /api/islands/ops に送り、
// 結果は応答（更新後の木）か refresh() で server の木を取り直して描画に反映する（クライアントで木を書き換えない）。
// Why not 楽観更新: 木の検証（循環・存在）は server の model が正で、クライアントで再実装すると食い違うため。

// 純関数（DOM / vis に依存しない）。

// ノードを編集の種別に分類する。session / more / DAG ノード / ungrouped の repo は null（編集対象外）。
function editableKind(node) {
  if (!node) return null;
  if (node._type === 'root') return 'root';
  if (node._type === 'island') return 'island';
  if (node._type === 'project' && node.id !== repoNodeId('')) return 'repo';
  return null;
}

// ノード ID（= ref）の親 ref。トップレベルは ''。islandsData は /api/islands（dangling 解決済み）。
function parentRefOf(id, islandsData) {
  var i;
  if (id.indexOf(ISLAND_PREFIX) === 0) {
    for (i = 0; i < islandsData.islands.length; i++) {
      if (islandNodeId(islandsData.islands[i].id) === id) return islandsData.islands[i].parent || '';
    }
  } else if (id.indexOf(REPO_PREFIX) === 0) {
    for (i = 0; i < islandsData.repos.length; i++) {
      if (repoNodeId(islandsData.repos[i].root) === id) return islandsData.repos[i].parent || '';
    }
  }
  return '';
}

// Enter で兄弟を足すときの親 ref。root は兄弟を持たないので "root の下"（'' = トップレベル）に足す。
function siblingParentRef(id, kind, islandsData) {
  return kind === 'root' ? '' : parentRefOf(id, islandsData);
}

// 削除確認で見せる子の ref（island → repo の順）。server は同じ集合を children として照合する。
function childrenRefsOf(ref, islandsData) {
  var out = [];
  islandsData.islands.forEach(function(is) { if (is.parent === ref) out.push(islandNodeId(is.id)); });
  islandsData.repos.forEach(function(r) { if (r.parent === ref) out.push(repoNodeId(r.root)); });
  return out;
}

// 右クリックメニューの項目。「親から外す」は親があるときだけ。
function contextMenuItems(kind, hasParent) {
  if (kind === 'root') return [{ action: 'addChild', label: '島を追加' }];
  var items = [{ action: 'addChild', label: '子の島を追加' }];
  if (kind === 'island') items.push({ action: 'attachRepo', label: 'repo を付ける…' });
  if (kind === 'island') items.push({ action: 'rename', label: '名前を変更' });
  if (hasParent) items.push({ action: 'detach', label: '親から外す' });
  if (kind === 'island') items.push({ action: 'delete', label: '削除', danger: true });
  return items;
}

// ref の子孫（island / repo を混ぜて辿る）の集合 {ref: true}。ref 自身は含まない。手編集の輪でも止まるよう visited で守る。
// Why: ドラッグで親を付け替えるとき、自分の子孫の下へは付けられない（循環）ので候補から外す。server も検証するが、
// 候補に出さないことで、落とせない場所へ落とす操作自体を無くす。
function descendantsOf(ref, islandsData) {
  var out = {};
  var stack = [ref];
  while (stack.length) {
    var cur = stack.pop();
    childrenRefsOf(cur, islandsData).forEach(function(c) {
      if (c !== ref && !out[c]) { out[c] = true; stack.push(c); }
    });
  }
  return out;
}

// ドラッグの落とし先の候補（ノード ID の配列）。island / repo / root のうち、ドラッグ中のノードとその子孫を除く。
function dropCandidateIds(nodes, draggedId, islandsData) {
  var banned = descendantsOf(draggedId, islandsData);
  banned[draggedId] = true;
  return nodes.filter(function(n) { return editableKind(n) && !banned[n.id]; }).map(function(n) { return n.id; });
}

// 落とした結果の操作。root へは親から外す（既にトップレベルなら何もしない）、
// island / repo へは付ける（既にそこが親なら何もしない）。無操作は null。
function dropOpFor(draggedId, targetId, islandsData) {
  var parent = parentRefOf(draggedId, islandsData);
  if (targetId === ROOT_ID) return parent === '' ? null : { op: 'detach', child: draggedId };
  if (parent === targetId) return null;
  return { op: 'attach', child: draggedId, parent: targetId };
}

// ポインタ（canvas 座標）を含む矩形の id。重なっていれば面積の小さい方（内側のノード）。boxes: [{id,left,right,top,bottom}]
function hitTarget(boxes, p) {
  var best = null, bestArea = Infinity;
  boxes.forEach(function(b) {
    if (p.x < b.left || p.x > b.right || p.y < b.top || p.y > b.bottom) return;
    var area = (b.right - b.left) * (b.bottom - b.top);
    if (area < bestArea) { best = b.id; bestArea = area; }
  });
  return best;
}

// 「repo を付ける」に出す repo。既にこの island の子のものと、付けると循環になるもの
// （この island が repo の子孫、つまり repo がこの island の祖先）を除く。
function attachableRepos(repos, islandRef, islandsData) {
  var children = {};
  childrenRefsOf(islandRef, islandsData).forEach(function(c) { children[c] = true; });
  return repos.filter(function(r) {
    var ref = repoNodeId(r.root);
    return !children[ref] && !descendantsOf(ref, islandsData)[islandRef];
  });
}

// 「repo を付ける」のメニュー項目。同じ basename の repo が複数あるときだけパスを添えて見分ける。
function repoMenuItems(repos) {
  if (repos.length === 0) return [{ action: 'none', label: '付けられる repo がありません', disabled: true }];
  var counts = {};
  repos.forEach(function(r) { counts[r.label] = (counts[r.label] || 0) + 1; });
  return repos.map(function(r) {
    return { action: 'pickRepo', root: r.root, label: counts[r.label] > 1 ? r.label + '  (' + r.root + ')' : r.label, title: r.root };
  });
}

// キー → 編集操作。対応しないキーは null（preventDefault しない）。rename / delete は island のみ。
function keyAction(key, kind) {
  if (!kind) return null;
  if (key === 'Tab') return 'addChild';
  if (key === 'Enter') return 'addSibling';
  if (kind !== 'island') return null;
  if (key === 'F2' || key === ' ') return 'rename';
  // Mac の「delete」キーは Backspace だが、打ち間違いで島を消さないよう Delete だけにする
  if (key === 'Delete') return 'delete';
  return null;
}

// 編集 UI（メニュー / 名前入力 / 削除確認）の状態。
// 編集中に届いた refresh は pendingData に預け、閉じてから反映する。
// Why: 5 秒ごとの再描画（graphNetwork の作り直し）で、開いている入力欄やメニューの足元からノードが消えるのを防ぐ。
var editState = { menu: null, input: null, confirm: null };
var pendingData = null;   // 編集中に届いた {mapData, graphData, islandsData}
var pendingSelect = null; // 操作成功後の再描画で選択するノード（add の戻り値）
var graphLaidOut = false; // 直近の描画の左右バランス配置が済んだか（視点の保存はこのとき以外は信用しない）
var carriedKeep = null;   // レイアウト前の描画が引き継ぐ予定の {scale, position, selected}
var graphRootId = null;   // 直近の描画の root ID。null なら編集不可（単一プロジェクト表示）
var dragState = null;     // ドラッグ中の状態（親付け替えの対象なら候補・強調中の落とし先も持つ）。holdRender で描画を保留する

// 編集 UI（メニュー / 名前入力 / 削除確認）が開いているか。
function editingActive() {
  return !!(editState.menu || editState.input || editState.confirm);
}

// 更新の反映（= network の作り直し）を保留すべきか。編集 UI に加えて、ドラッグ中も保留する
// （作り直されるとドラッグが途切れるため）。ドラッグは UI を持たないので editingActive には含めない。
function holdRender() {
  return editingActive() || !!dragState;
}

function removeMenu() {
  if (editState.menu) { editState.menu.remove(); editState.menu = null; }
}
function removeConfirm() {
  if (editState.confirm) { editState.confirm.remove(); editState.confirm = null; }
}
function removeInput() {
  if (editState.input) {
    var el = editState.input;
    editState.input = null; // remove() が blur を起こすので、先に外しておく
    el.remove();
  }
}

// 編集 UI（メニュー / 名前入力 / 削除確認）の DOM を全部外す。保留分の反映やフォーカス移動はしない。
function closeEditUI() {
  removeMenu(); removeInput(); removeConfirm();
}

// 保留していた更新があり、編集 UI がすべて閉じていれば反映する（変化の有無は applyRefreshed が再判定する）。
function flushPending() {
  if (holdRender() || !pendingData) return;
  var p = pendingData;
  pendingData = null;
  applyRefreshed(p);
}

// ユーザー操作で編集 UI を閉じる。保留分を反映する。
// 閉じたあとはキー操作を続けられるようグラフにフォーカスを戻す。blur（別の要素をクリック）で閉じる場合は、
// クリックされた側のフォーカスを奪わないよう noFocus を渡す。
function endEditing(noFocus) {
  closeEditUI();
  var focusEl = graphFocusEl();
  if (!noFocus && focusEl && graphRootId) focusEl.focus({ preventScroll: true });
  flushPending();
}

// キー操作を受ける要素は vis の frame（tabindex=0 で、vis の keyboard もここに束縛される）。再描画のたびに作り直される。
function graphFocusEl() {
  var canvasEl = document.getElementById('graph-canvas');
  return canvasEl && (canvasEl.querySelector('.vis-network') || canvasEl);
}

// 編集 UI の外を押したときの閉じ方。UI はすぐ閉じるが、保留していた更新の反映（= network の作り直し）は
// そのクリックが済んでから行う。押下の直後に作り直すと、続くクリック / 右クリックが
// レイアウト前の network に当たり、描画完了後に古い選択へ戻されるため。
var deferredFlushTimer = null;
function closeEditUIOnOutsideMouseDown() {
  closeEditUI();
  function flushLater() {
    document.removeEventListener('click', flushLater, true);
    document.removeEventListener('contextmenu', flushLater, true);
    clearTimeout(deferredFlushTimer);
    deferredFlushTimer = null;
    setTimeout(flushPending, 0); // vis のクリック処理（選択）が先に済むようにする
  }
  document.addEventListener('click', flushLater, true);
  document.addEventListener('contextmenu', flushLater, true);
  // クリックにならなかった（ドラッグ等）場合の保険
  deferredFlushTimer = setTimeout(flushLater, 1000);
}

// 描画の作り直し（フィルタ・プロジェクト切り替え）で消える UI を捨てる。保留分も捨てる（次の refresh が取り直す）。
function cancelEditing() {
  cancelDrag();
  closeEditUI();
  pendingData = null;
  pendingSelect = null; // 古い操作の選択が、次の無関係な描画で効かないように
}

var toastTimer = null;
function showToast(message) {
  var el = document.getElementById('devctx-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'devctx-toast';
    el.className = 'devctx-toast';
    el.setAttribute('role', 'alert');
    document.body.appendChild(el);
  }
  el.textContent = message;
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.style.display = 'none'; }, 4000);
}

// POST /api/islands/ops。ネットワーク失敗も {ok:false} で返し、呼び出し側は 1 経路で扱う。
async function postIslandOp(body) {
  try {
    var res = await fetch('/api/islands/ops', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    var data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    return { ok: res.ok, status: res.status, data: data };
  } catch (e) {
    return { ok: false, status: 0, data: { error: 'network error' } };
  }
}

// 操作後に選択するノード（add 以外）。rename / attach / detach は対象、remove は親（トップレベルなら無し）。
// add は作ったノードが応答の ref で決まる。
function selectAfterOp(body) {
  if (body.op === 'rename') return body.ref;
  if (body.op === 'attach' || body.op === 'detach') return body.child;
  if (body.op === 'remove') return parentRefOf(body.ref, cachedIslands) || null;
  return null;
}

// 操作を送り、成功なら応答の木（GET /api/islands と同形）で描画する。
// Why not 成功後に refresh(): 応答に更新後の木が入っているので、全体取得（roadmap-map / graph / islands の 3 本）を省ける。
// 失敗（409 等）は server の現状と食い違っているので、全体を取り直す。
async function runIslandOp(body) {
  var select = selectAfterOp(body); // remove の親は、消える前の木から引く
  var res = await postIslandOp(body);
  if (!res.ok || !res.data || !res.data.islands) {
    var err = res.data && res.data.error;
    if (res.status === 409 && err === 'children changed') {
      showToast('子が変わりました。もう一度確認してください');
    } else {
      showToast(err || ('HTTP ' + res.status));
    }
    refresh();
    return;
  }
  pendingSelect = body.op === 'add' ? (res.data.ref || null) : select;
  // 進行中の取得（ポーリング）は、この操作より前の木を持っているので捨てさせる
  refreshSeq++;
  applyRefreshed({ mapData: cachedData, graphData: cachedGraphData, islandsData: normalizeIslands(res.data.islands) });
  // 編集 UI が開いていて保留になった場合だけ、選択を保留の反映まで残す
  if (!pendingData) pendingSelect = null;
}

// ノードの DOM 座標（graph-canvas 内）の矩形
function nodeDomBox(nodeId) {
  var b = graphNetwork.getBoundingBox(nodeId);
  var tl = graphNetwork.canvasToDOM({ x: b.left, y: b.top });
  var br = graphNetwork.canvasToDOM({ x: b.right, y: b.bottom });
  return { left: tl.x, top: tl.y, right: br.x, bottom: br.y };
}

// ノード上（rename）または親ノードの横（add）に名前入力を出す。Enter で確定、Esc / blur でキャンセル。
// mode 'add' は root より右にある親なら右側、左なら左側に出す（子が広がる側と合わせる）。
function openNameInput(o) {
  closeEditUI();
  var container = document.getElementById('graph-container');
  var canvasEl = document.getElementById('graph-canvas');
  var box = nodeDomBox(o.anchorId);
  var width = 160;
  var left, top = (box.top + box.bottom) / 2 - 14;
  if (o.mode === 'rename') {
    width = Math.max(140, box.right - box.left);
    left = box.left;
  } else {
    var onRight = graphNetwork.getPosition(o.anchorId).x >= graphNetwork.getPosition(ROOT_ID).x;
    left = onRight ? box.right + 24 : box.left - 24 - width;
  }
  var input = document.createElement('input');
  input.type = 'text';
  input.className = 'island-name-input';
  input.maxLength = 80;
  input.value = o.initial || '';
  input.placeholder = '島の名前';
  input.setAttribute('aria-label', '島の名前');
  input.style.left = (canvasEl.offsetLeft + left) + 'px';
  input.style.top = (canvasEl.offsetTop + top) + 'px';
  input.style.width = width + 'px';

  var done = false;
  function finish(commit, fromBlur) {
    if (done) return;
    done = true;
    var name = input.value.trim();
    endEditing(fromBlur);
    if (commit && name) o.onCommit(name);
  }
  input.addEventListener('keydown', function(e) {
    // 日本語入力の変換確定の Enter は確定扱いにしない
    if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
    e.stopPropagation();
  });
  input.addEventListener('blur', function() { finish(false, true); });
  container.appendChild(input);
  editState.input = input;
  input.focus();
  input.select();
}

function startAddIsland(parentRef, anchorId) {
  openNameInput({
    mode: 'add', anchorId: anchorId, initial: '',
    onCommit: function(name) { runIslandOp({ op: 'add', name: name, parent: parentRef }); }
  });
}

function startRenameIsland(ref) {
  var node = graphNodes.get(ref);
  var current = node && node._data ? node._data.name : '';
  openNameInput({
    mode: 'rename', anchorId: ref, initial: current,
    onCommit: function(name) {
      if (name !== current) runIslandOp({ op: 'rename', ref: ref, name: name });
    }
  });
}

function refLabel(ref) {
  var node = graphNodes.get(ref);
  if (node && node._data && node._data.name) return node._data.name;
  return ref.indexOf(REPO_PREFIX) === 0 ? repoBaseName(ref.slice(REPO_PREFIX.length)) : ref;
}

// 削除確認の文言。子がいれば付け替え先の説明と一覧、いなければ単純な確認。純関数。
function deleteConfirmModel(name, childLabels) {
  if (childLabels.length === 0) {
    return { title: '「' + name + '」を削除', lead: 'この島を削除します。', items: [], okLabel: '削除' };
  }
  return {
    title: '「' + name + '」を削除',
    lead: '次の ' + childLabels.length + ' 件は親へ付け替えられます。',
    items: childLabels,
    okLabel: '子を親へ付け替えて削除'
  };
}

// 島の削除は必ず確認する（元に戻せないため）。子がいれば子を親へ付け替えて消す。
function startDeleteIsland(ref) {
  var children = childrenRefsOf(ref, cachedIslands);
  var model = deleteConfirmModel(refLabel(ref), children.map(refLabel));
  closeEditUI();
  var panel = document.createElement('div');
  panel.className = 'island-confirm';
  panel.setAttribute('role', 'dialog');
  var title = document.createElement('div');
  title.className = 'confirm-title';
  title.textContent = model.title;
  var lead = document.createElement('div');
  lead.textContent = model.lead;
  var list = document.createElement('ul');
  model.items.forEach(function(label) {
    var li = document.createElement('li');
    li.textContent = label;
    list.appendChild(li);
  });
  var actions = document.createElement('div');
  actions.className = 'confirm-actions';
  var cancel = document.createElement('button');
  cancel.type = 'button';
  cancel.textContent = 'キャンセル';
  cancel.addEventListener('click', function() { endEditing(); });
  var ok = document.createElement('button');
  ok.type = 'button';
  ok.className = 'danger';
  ok.textContent = model.okLabel;
  ok.addEventListener('click', function() {
    endEditing();
    runIslandOp({ op: 'remove', ref: ref, children: children });
  });
  actions.appendChild(cancel);
  actions.appendChild(ok);
  [title, lead, list, actions].forEach(function(el) { panel.appendChild(el); });
  document.getElementById('graph-container').appendChild(panel);
  editState.confirm = panel;
  cancel.focus(); // 既定は安全側（キャンセル）
}

// 操作の実行。kind は editableKind の結果、id はノード ID（= ref。root は ROOT_ID）。
function runEditAction(action, id, kind) {
  if (action === 'addChild') {
    startAddIsland(kind === 'root' ? '' : id, id);
  } else if (action === 'addSibling') {
    var parent = siblingParentRef(id, kind, cachedIslands);
    startAddIsland(parent, parent || ROOT_ID);
  } else if (action === 'rename') {
    startRenameIsland(id);
  } else if (action === 'detach') {
    endEditing(); // メニューを閉じ、保留分を反映してから送る
    runIslandOp({ op: 'detach', child: id });
  } else if (action === 'delete') {
    startDeleteIsland(id);
  }
}

// 右クリックメニュー。DOM は createElement / textContent だけで組む。
function buildContextMenu(items, x, y, onPick) {
  var menu = document.createElement('div');
  menu.className = 'ctx-menu';
  menu.setAttribute('role', 'menu');
  items.forEach(function(item) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'ctx-item' + (item.danger ? ' danger' : '');
    b.setAttribute('role', 'menuitem');
    b.textContent = item.label;
    if (item.title) b.title = item.title;
    if (item.disabled) b.disabled = true;
    else b.addEventListener('click', function() { onPick(item.action, item); });
    menu.appendChild(b);
  });
  menu.addEventListener('keydown', function(e) {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    e.preventDefault();
    var btns = Array.prototype.slice.call(menu.querySelectorAll('.ctx-item'));
    var i = btns.indexOf(document.activeElement);
    i = e.key === 'ArrowDown' ? (i + 1) % btns.length : (i - 1 + btns.length) % btns.length;
    btns[i].focus();
  });
  document.body.appendChild(menu);
  // 画面外にはみ出さないよう、実寸を測ってから置く
  menu.style.left = Math.max(4, Math.min(x, window.innerWidth - menu.offsetWidth - 4)) + 'px';
  menu.style.top = Math.max(4, Math.min(y, window.innerHeight - menu.offsetHeight - 4)) + 'px';
  return menu;
}

// 既知 repo の一覧（GET /api/islands/known-repos）。メニューを開いたときだけ取りに行く（ポーリングには含めない）。失敗は null。
async function fetchKnownRepos() {
  var data = await fetchOptionalJSON('/api/islands/known-repos');
  return data && Array.isArray(data.repos) ? data.repos : null;
}

// 「repo を付ける…」。メニューを repo の一覧に差し替える（同じ位置）。一覧はここで初めて取りに行く
// （メニューを開くたびには取らない）。取得中は無効の項目を出し、済む前に閉じられていたら何もしない。
async function showRepoSubmenu(islandRef, x, y) {
  removeMenu();
  var loadingMenu = buildContextMenu([{ action: 'none', label: '読み込み中…', disabled: true }], x, y, function() {});
  editState.menu = loadingMenu;
  var repos = await fetchKnownRepos();
  if (editState.menu !== loadingMenu) return;
  if (repos === null) {
    endEditing();
    showToast('repo の一覧を取得できませんでした');
    return;
  }
  var items = repoMenuItems(attachableRepos(repos, islandRef, cachedIslands));
  removeMenu();
  editState.menu = buildContextMenu(items, x, y, function(action, item) {
    if (action !== 'pickRepo') return;
    endEditing();
    runIslandOp({ op: 'attach', child: repoNodeId(item.root), parent: islandRef });
  });
  var first = editState.menu.querySelector('.ctx-item:not([disabled])');
  if (first) first.focus();
}

function openContextMenu(nodeId, x, y) {
  var node = graphNodes.get(nodeId);
  var kind = editableKind(node);
  if (!kind) return false;
  closeEditUI();
  var items = contextMenuItems(kind, !!parentRefOf(nodeId, cachedIslands));
  editState.menu = buildContextMenu(items, x, y, function(action) {
    if (action === 'attachRepo') {
      showRepoSubmenu(nodeId, x, y);
      return;
    }
    runEditAction(action, nodeId, kind);
  });
  var first = editState.menu.querySelector('.ctx-item');
  if (first) first.focus();
  return true;
}

// ── ドラッグで親を付け替える ──
// island / repo ノードを別の island / repo / root にドラッグして落とすと、その下に付く（root は親から外す）。
// ドラッグ中は編集中として扱い（editingActive）、ポーリングの描画を保留する。作り直されるとドラッグが途切れるため。
var DROP_BORDER = '#EF6F6F'; // 落とし先の強調色（MindMup の落とし先と同じ赤の破線）

// 落とし先の強調を戻す。ノードが作り直し等で無ければ何もしない。
function restoreDropHighlight() {
  var st = dragState;
  if (!st || !st.saved) return;
  var saved = st.saved;
  st.saved = null;
  if (graphNodes && graphNodes.get(saved.id)) {
    graphNodes.update({ id: saved.id, color: saved.color, borderWidth: saved.borderWidth, shapeProperties: saved.shapeProperties });
  }
}

function setDropHighlight(id) {
  var st = dragState;
  if (!st || st.target === id) return;
  restoreDropHighlight();
  st.target = id;
  var n = id ? graphNodes.get(id) : null;
  if (!n) return;
  // 元の見た目を控え、枠だけ赤い破線にする（背景は元のまま。透過させない）
  st.saved = { id: id, color: n.color, borderWidth: n.borderWidth, shapeProperties: n.shapeProperties };
  var bg = n.color && n.color.background;
  var c = { background: bg, border: DROP_BORDER };
  graphNodes.update({
    id: id,
    color: { background: bg, border: DROP_BORDER, highlight: c, hover: c },
    borderWidth: 3,
    shapeProperties: Object.assign({}, n.shapeProperties, { borderDashes: [6, 4] })
  });
}

// ドラッグ開始。親付け替えの対象（All Projects の island / repo ノード 1 つ）なら、候補とその矩形を先に求める。
// それ以外（視点のパン・session などのノード）も、描画の作り直しで途切れないよう dragState だけは立てる（holdRender 用）。
function beginDrag(nodeId) {
  var kind = nodeId ? editableKind(graphNodes.get(nodeId)) : null;
  if (!graphRootId || (kind !== 'island' && kind !== 'repo')) {
    dragState = { id: null };
    return;
  }
  // 矩形は canvas 座標。候補はドラッグ中に動かない（動かすのは掴んだノードだけ）ので、1 回測れば足りる
  var boxes = dropCandidateIds(graphNodes.get(), nodeId, cachedIslands).map(function(id) {
    var b = graphNetwork.getBoundingBox(id);
    return { id: id, left: b.left, right: b.right, top: b.top, bottom: b.bottom };
  });
  dragState = { id: nodeId, boxes: boxes, target: null, saved: null, cancelled: false };
}

function updateDragTarget(canvasPoint) {
  var st = dragState;
  if (!st || !st.id || st.cancelled) return;
  setDropHighlight(hitTarget(st.boxes, canvasPoint));
}

// ドラッグ終了。強調中の落とし先があり、結果が無操作でなければ runIslandOp で送る。
// 落とし先は離す直前の強調（dragging で更新した target）だけを見る。グラフの外へ出たときは mouseleave が外している。
// 送る間は dragState を残す（= 描画を保留する）ので、応答の木は保留に入り、完了後に flushPending で反映される。
// Why: ポーリング由来の古い保留が、操作の結果を上書きして描画しないようにする（応答反映時に refreshSeq も進む）。
function finishDrag() {
  var st = dragState;
  if (!st) return;
  var target = st.id && !st.cancelled ? st.target : null;
  restoreDropHighlight();
  var op = target ? dropOpFor(st.id, target, cachedIslands) : null;
  if (!op) {
    dragState = null;
    flushPending();
    return;
  }
  runIslandOp(op).then(function() {
    // 待っている間に次のドラッグが始まっていたら、その状態は触らない
    if (dragState !== st) return;
    dragState = null;
    flushPending();
  });
}

// Esc: 掴んだまま取り消す。ボタンを離すまでは dragState を残し（描画を保留）、離したら何もせず終わる。
function softCancelDrag() {
  var st = dragState;
  if (!st || !st.id || st.cancelled) return;
  st.cancelled = true;
  restoreDropHighlight();
  st.target = null;
}

// 表示切り替え・プロジェクト切り替え・再描画で、ドラッグ状態を捨てる。
function cancelDrag() {
  restoreDropHighlight();
  dragState = null;
}

// 編集 UI を閉じる共通のきっかけ（メニュー外クリック / Esc / スクロール）。入力欄はスクロールに追従するので残す。
document.addEventListener('mousedown', function(e) {
  var outside = (editState.menu && !editState.menu.contains(e.target)) ||
    (editState.confirm && !editState.confirm.contains(e.target));
  if (outside) closeEditUIOnOutsideMouseDown();
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && dragState) softCancelDrag();
  if (e.key === 'Escape' && (editState.menu || editState.confirm)) endEditing();
});
// ポインタがグラフの外へ出たら、落とし先の強調を外す（離しても何も起きない）
document.getElementById('graph-canvas').addEventListener('mouseleave', function() {
  if (dragState && dragState.id && !dragState.cancelled) setDropHighlight(null);
});
window.addEventListener('scroll', function() { if (editState.menu) endEditing(true); }, true);

// グラフにフォーカスがあり、編集可能なノードが 1 つ選ばれ、編集 UI が開いていないときだけキー操作を受ける。
function onGraphKeydown(e) {
  if (!graphRootId || !graphNetwork || editingActive()) return;
  // 入力欄などではなく、グラフ自身（vis の frame）にフォーカスがあるときだけ
  if (e.target !== graphFocusEl()) return;
  if (e.isComposing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Escape') {
    // 編集 UI が無いときの Esc は、選択を外してグラフからフォーカスを離す
    graphNetwork.unselectAll();
    e.target.blur();
    return;
  }
  if (e.shiftKey) return; // Shift+Tab（フォーカスを戻す）などを奪わない
  var sel = graphNetwork.getSelectedNodes();
  if (sel.length !== 1) return;
  var kind = editableKind(graphNodes.get(sel[0]));
  var action = keyAction(e.key, kind);
  if (!action) return;
  e.preventDefault();
  runEditAction(action, sel[0], kind);
}
document.getElementById('graph-canvas').addEventListener('keydown', onGraphKeydown);

var cachedGraphData = null; // cached /api/roadmap-graph data

// opts.preserveView: 再描画（refresh / 編集後）で拡大率・視点・選択を引き継ぐ。初回・プロジェクト切り替え・フィルタ変更は fit し直す。
// opts.select: 描画後に選択するノード ID（add で作ったノード）。
function renderGraphView(groups, graphData, opts) {
  opts = opts || {};
  // 作り直すと vis の frame（フォーカス先）も新しくなるので、フォーカスを持っていたかを先に控える
  var focusEl = graphFocusEl();
  var hadFocus = !!focusEl && document.activeElement === focusEl;
  var userPicked = false; // 作り直しの後、レイアウト完了前に利用者がノードを選んだか
  cancelEditing(); // ノードごと作り直すので、開いている編集 UI は残せない
  var keep = null;
  if (opts.preserveView && graphNetwork && graphRootId) {
    // 直前の描画がまだレイアウト前（afterDrawing 前）なら、作りたての network の scale=1・選択なしを拾わず、
    // その描画が引き継ごうとしていた値をそのまま持ち越す。refresh が立て続けに描画するとき視点・選択が失われるため
    keep = graphLaidOut
      ? { scale: graphNetwork.getScale(), position: graphNetwork.getViewPosition(), selected: graphNetwork.getSelectedNodes()[0] || null }
      : carriedKeep;
  }
  if (keep && opts.select) keep = { scale: keep.scale, position: keep.position, selected: opts.select };
  carriedKeep = keep;
  graphLaidOut = false;
  graphGroups = groups;
  updateProjectSelect(groups);

  // Use semantic DAG when graph data is available
  var useDAG = !!graphData;
  var filteredGraph = null;
  if (useDAG) {
    filteredGraph = selectedProject
      ? graphData.filter(function(g) { return g.repo_root === selectedProject; })
      : graphData;
    if (filteredGraph.length === 0) useDAG = false; // fallback to tree if no match
  }
  var data = useDAG ? buildSemanticGraph(filteredGraph) : buildMindMapData(groups);

  // Destroy and recreate network for clean hierarchical layout
  if (graphNetwork) {
    graphNetwork.destroy();
    graphNetwork = null;
  }

  graphRootId = data.rootId;
  graphNodes = new vis.DataSet(data.nodes);
  graphEdges = new vis.DataSet(data.edges);
  var container = document.getElementById('graph-canvas');
  graphNetwork = new vis.Network(container, { nodes: graphNodes, edges: graphEdges }, {
    layout: {
      hierarchical: {
        enabled: true,
        direction: 'LR',
        sortMethod: 'directed',
        levelSeparation: 200,
        nodeSpacing: 45,
        treeSpacing: 50,
        parentCentralization: true,
        blockShifting: true,
        edgeMinimization: true
      }
    },
    physics: { enabled: false },
    interaction: {
      hover: true,
      tooltipDelay: 200,
      dragNodes: true,
      dragView: true,
      zoomView: true,
      zoomSpeed: 0.3,
      multiselect: false,
      navigationButtons: false,
      // 矢印・+/- による移動・拡大は frame に束縛する。window 束縛だと名前入力中の矢印や '-' を奪うため
      keyboard: { enabled: true, bindToWindow: false, speed: { x: 10, y: 10, zoom: 0.03 } }
    },
    edges: {
      arrows: { to: false },
      color: { color: MINDMAP_THEME.edge, hover: '#8b949e', inherit: false },
      width: 1,
      smooth: { type: 'cubicBezier', forceDirection: 'horizontal', roundness: 0.8 }
    }
  });

  // After initial hierarchical layout, disable it so nodes can be dragged freely
  var rootId = data.rootId;
  graphNetwork.once('afterDrawing', function() {
    var layout = null;
    if (rootId) {
      // hierarchical を切る前に、初期配置の座標と実寸の高さを読む
      var pos = graphNetwork.getPositions();
      var measured = graphNodes.getIds().map(function(id) {
        var box = graphNetwork.getBoundingBox(id);
        return { id: id, label: graphNodes.get(id).label, x: pos[id].x, y: pos[id].y, h: box.bottom - box.top };
      });
      layout = balancedLayout(measured, graphEdges.get(), rootId, islandSides);
      if (layout) islandSides = layout.headSides;
    }
    graphNetwork.setOptions({ layout: { hierarchical: { enabled: false } } });
    graphLaidOut = true;
    carriedKeep = null;
    if (layout) {
      graphNodes.update(Object.keys(layout.positions).map(function(id) {
        return { id: id, x: layout.positions[id].x, y: layout.positions[id].y };
      }));
      if (keep) {
        graphNetwork.moveTo({ scale: keep.scale, position: keep.position, animation: false });
      } else {
        graphNetwork.fit({ maxZoomLevel: FIT_MAX_ZOOM });
      }
      var reselect = opts.select && graphNodes.get(opts.select) ? opts.select
        : keep && keep.selected && graphNodes.get(keep.selected) ? keep.selected : null;
      if (reselect && !userPicked) graphNetwork.selectNodes([reselect]);
    }
    if (hadFocus) {
      var fe = graphFocusEl();
      if (fe) fe.focus({ preventScroll: true });
    }
  });

  graphNetwork.on('oncontext', function(params) {
    if (!graphRootId) return;
    var id = graphNetwork.getNodeAt(params.pointer.DOM);
    if (id === undefined || !editableKind(graphNodes.get(id))) return;
    graphNetwork.selectNodes([id]);
    var src = params.event && params.event.srcEvent;
    // ブラウザ標準のメニューを出さない（編集可能なノード上のときだけ）
    if (params.event && params.event.preventDefault) params.event.preventDefault();
    if (src && src.preventDefault) src.preventDefault();
    var rect = document.getElementById('graph-canvas').getBoundingClientRect();
    openContextMenu(id, src ? src.clientX : rect.left + params.pointer.DOM.x, src ? src.clientY : rect.top + params.pointer.DOM.y);
  });
  // ズーム・パンで入力欄などが指すノードとずれるので閉じる
  graphNetwork.on('zoom', function() { if (editingActive()) endEditing(true); });
  // ドラッグ開始では編集 UI を閉じるだけで、保留した更新は反映しない（反映は作り直しなのでドラッグが途切れる）
  graphNetwork.on('dragStart', function(params) {
    closeEditUI();
    beginDrag(params.nodes.length === 1 ? params.nodes[0] : null);
  });
  graphNetwork.on('dragging', function(params) {
    if (dragState && dragState.id) updateDragTarget(params.pointer.canvas);
  });
  graphNetwork.on('dragEnd', function() { finishDrag(); });

  graphNetwork.on('click', function(params) {
    // キー操作を受けるため、クリックでグラフにフォーカスを移す
    var fe = graphFocusEl();
    if (fe) fe.focus({ preventScroll: true });
    // 描画の作り直しの直後（レイアウト前）に押された場合、完了後に古い選択へ戻さない
    userPicked = true;
    if (keep) keep.selected = params.nodes[0] || null;
    if (params.nodes.length > 0) {
      var nodeData = graphNodes.get(params.nodes[0]);
      if (nodeData._type === 'session') {
        showInspector(nodeData._data);
      } else if (nodeData._type === 'island') {
        // island に見せる詳細は無い。編集は右クリック / キー操作
        closeInspector();
      } else if (nodeData._type === 'more') {
        // Click "+N more" to select that project
        var sel = document.getElementById('project-select');
        sel.value = nodeData._data.repo_root;
        onProjectChange();
      } else {
        closeInspector();
      }
    } else {
      closeInspector();
    }
  });

  var sessionCount = 0;
  groups.forEach(function(g) { sessionCount += g.sessions.length; });
  var now = new Date();
  document.getElementById('meta').textContent =
    sessionCount + ' session(s) | Mind Map | Updated: ' + now.toLocaleTimeString();
}

function showInspector(session) {
  var inspector = document.getElementById('graph-inspector');
  inspector.style.display = 'block';
  document.getElementById('inspector-name').textContent = session.name;

  var body = document.getElementById('inspector-body');
  body.replaceChildren();

  function addSection(title, content) {
    if (!content) return;
    var sec = document.createElement('div');
    sec.className = 'inspector-section';
    var t = document.createElement('div');
    t.className = 'inspector-section-title';
    t.textContent = title;
    sec.appendChild(t);
    var v = document.createElement('div');
    v.className = 'inspector-value';
    if (typeof content === 'string') {
      v.textContent = content;
    } else {
      v.appendChild(content);
    }
    sec.appendChild(v);
    body.appendChild(sec);
  }

  // Status & Phase
  var statusPhase = document.createElement('div');
  statusPhase.style.display = 'flex';
  statusPhase.style.gap = '8px';
  statusPhase.style.marginBottom = '4px';
  var statusBadge = document.createElement('span');
  statusBadge.className = 'card-status status-' + (session.status || '').replace(/[^a-z-]/g, '');
  statusBadge.textContent = session.status;
  statusPhase.appendChild(statusBadge);
  var phaseBadge = document.createElement('span');
  phaseBadge.className = 'milestone-chip achieved';
  phaseBadge.textContent = PHASE_LABELS[session.phase] || session.phase;
  statusPhase.appendChild(phaseBadge);
  addSection('Status', statusPhase);

  addSection('Branch', session.branch);
  if (session.goal) addSection('Goal', session.goal);
  if (session.current_focus) addSection('Focus', session.current_focus);
  if (session.next_step) addSection('Next Step', session.next_step);

  if (session.attention_state) {
    var badge = document.createElement('span');
    badge.className = 'attention-badge attention-' + session.attention_state;
    badge.textContent = session.attention_state;
    addSection('Attention', badge);
  }

  // Pipeline
  addSection('Pipeline', createPipeline(session.phase));

  // Milestones
  if (session.milestones) {
    addSection('Milestones', createMilestoneChips(session.milestones));
  }

  // Topics
  if (session.topics && session.topics.length > 0) {
    var topicsEl = document.createElement('div');
    session.topics.forEach(function(topic) {
      var tag = document.createElement('span');
      tag.className = 'topic-tag' + (topic.source === 'git' ? ' git' : topic.source === 'manual' ? ' manual' : '');
      tag.textContent = topic.name;
      topicsEl.appendChild(tag);
    });
    addSection('Topics', topicsEl);
  }

  // Tasks
  if (session.tasks && session.tasks.length > 0) {
    var tasksEl = document.createElement('div');
    session.tasks.forEach(function(task) {
      var item = document.createElement('div');
      item.className = 'task-item';
      var icon = document.createElement('span');
      icon.className = 'task-icon task-' + task.status;
      icon.textContent = TASK_ICONS_MAP[task.status] || '\u25CB';
      item.appendChild(icon);
      var title = document.createElement('span');
      title.textContent = task.title;
      item.appendChild(title);
      tasksEl.appendChild(item);
    });
    addSection('Tasks', tasksEl);
  }

  // Links
  if (session.pr_url || session.issue_url) {
    var linksEl = document.createElement('div');
    linksEl.className = 'card-links';
    if (session.pr_url) {
      var a = document.createElement('a');
      a.href = session.pr_url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = 'Pull Request';
      linksEl.appendChild(a);
    }
    if (session.issue_url) {
      var a2 = document.createElement('a');
      a2.href = session.issue_url;
      a2.target = '_blank';
      a2.rel = 'noopener noreferrer';
      a2.textContent = 'Issue';
      a2.style.marginLeft = '8px';
      linksEl.appendChild(a2);
    }
    addSection('Links', linksEl);
  }

  // Timestamps
  addSection('Last Seen', formatDateTime(session.last_seen));
  if (session.inferred_at) addSection('Inferred', session.inferred_at);
}

function closeInspector() {
  document.getElementById('graph-inspector').style.display = 'none';
}

function onFilterChange() {
  if (currentView === 'graph' && graphGroups) {
    renderGraphView(graphGroups, cachedGraphData);
  }
}

// Filter sessions by period and done status
function filterSessions(sessions) {
  var periodDays = parseInt(document.getElementById('period-filter').value, 10);
  var hideDone = document.getElementById('hide-done').checked;
  var now = Date.now();

  return sessions.filter(function(s) {
    // Hide done
    if (hideDone && s.status === 'done') return false;

    // Period filter (0 = all)
    if (periodDays > 0 && s.last_seen) {
      var lastSeen = new Date(s.last_seen).getTime();
      if (now - lastSeen > periodDays * 86400000) return false;
    }

    return true;
  });
}

var projectChanging = false;
async function onProjectChange() {
  cancelEditing();
  islandSides = {};
  projectChanging = true;
  selectedProject = document.getElementById('project-select').value;
  // Fetch graph data for DAG view
  cachedGraphData = await fetchOptionalJSON('/api/roadmap-graph'); // refresh と同じ失敗時の扱い（null → tree に fallback）
  var islandsData = await fetchOptionalJSON('/api/islands');
  if (islandsData) cachedIslands = normalizeIslands(islandsData);
  lastJson = dataFingerprint(cachedData, cachedGraphData, cachedIslands);
  renderGraphView(graphGroups, cachedGraphData);
  projectChanging = false;
}

function graphFit() {
  if (graphNetwork) graphNetwork.fit({ animation: true, maxZoomLevel: FIT_MAX_ZOOM });
}

// Reset は視点を全体表示に戻し、部分木の左右も振り直す（islandSides は新しい島ほど片側に偏りうるので、ここで手放す）。
function graphReset() {
  islandSides = {};
  if (currentView === 'graph' && graphGroups && graphNetwork) {
    renderGraphView(graphGroups, cachedGraphData); // preserveView なし = fit し直す
  }
}

// 再描画の要否判定用。map / graph / islands のどれが変わっても差が出る
var lastJson = '';
function dataFingerprint(mapData, graphData, islandsData) {
  return JSON.stringify(mapData) + JSON.stringify(graphData) + JSON.stringify(islandsData);
}

// 任意の API: 失敗・非 2xx は null（呼び出し側が前回値や fallback に戻す）
async function fetchOptionalJSON(url) {
  try {
    var res = await fetch(url);
    return res.ok ? await res.json() : null;
  } catch (e) { return null; }
}

// refresh は同時に 1 本だけ走らせる。ポーリングは走行中なら見送り、操作失敗後などの明示的な要求は
// 走行中なら終了後に 1 回だけ再実行する。
// Why: 取得が 5 秒より長引いたときにポーリングが重なって、古い取得が新しい取得を追い越すのを防ぐ。
// refreshSeq は、取得の途中で操作の応答（より新しい木）が反映されたとき、その取得を捨てるための世代。
var refreshSeq = 0;
var refreshInFlight = false;
var refreshRerun = false;
async function refresh(opts) {
  if (projectChanging) return; // skip refresh during project change
  if (refreshInFlight) {
    if (!(opts && opts.poll)) refreshRerun = true;
    return;
  }
  refreshInFlight = true;
  try {
    await fetchAndApply();
  } finally {
    refreshInFlight = false;
  }
  if (refreshRerun) {
    refreshRerun = false;
    await refresh();
  }
}

async function fetchAndApply() {
  var seq = refreshSeq;
  try {
    var res = await fetch('/api/roadmap-map');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var newData = await res.json();

    // Also fetch graph data for DAG view and the islands tree (both optional: failures fall back)
    var graphData = null;
    var islandsData = cachedIslands;
    if (currentView === 'graph') {
      var extras = await Promise.all([
        fetchOptionalJSON('/api/roadmap-graph'),
        fetchOptionalJSON('/api/islands')
      ]);
      graphData = extras[0];
      // 取得失敗時は直前の木を保つ（一時的な失敗で island が消えて見えないように）
      if (extras[1]) islandsData = normalizeIslands(extras[1]);
    }
    if (seq !== refreshSeq) return;
    applyRefreshed({ mapData: newData, graphData: graphData, islandsData: islandsData });
  } catch (e) {
    document.getElementById('meta').textContent = 'Error: ' + e.message;
  }
}

// 取得した最新データを画面に反映する。編集 UI が開いている間は反映せず pendingData に預ける
// （閉じたときに flushPending が再度ここへ通し、そのとき変化があれば描画する）。
function applyRefreshed(r) {
  if (holdRender()) {
    pendingData = r;
    return;
  }
  pendingData = null; // より新しい取得が反映されるので、古い保留は捨てる
  var newData = r.mapData, graphData = r.graphData, islandsData = r.islandsData;
  // 比較用の文字列は前回分を持ち回り、新しいデータだけ stringify する
  var newJson = dataFingerprint(newData, graphData, islandsData);
  // For mind map view, skip re-render if data hasn't changed (preserves zoom/pan)
  if (currentView === 'graph' && cachedData && graphNetwork) {
    if (newJson === lastJson) {
      var sessionCount = 0;
      newData.forEach(function(g) { sessionCount += g.sessions.length; });
      var now = new Date();
      document.getElementById('meta').textContent =
        sessionCount + ' session(s) | Mind Map | Updated: ' + now.toLocaleTimeString();
      return;
    }
  }
  cachedData = newData;
  cachedGraphData = graphData;
  cachedIslands = islandsData;
  lastJson = newJson;
  if (currentView === 'graph') {
    renderGraphView(cachedData, cachedGraphData, { preserveView: true, select: pendingSelect });
    pendingSelect = null;
  } else {
    render(cachedData);
  }
}

// Restore saved view on load
if (currentView !== 'project') {
  setView(currentView);
} else {
  refresh();
}
setInterval(function() { refresh({ poll: true }); }, 5000);
</script>
</body>
</html>
